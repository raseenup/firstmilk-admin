name: Import official First Milk Venture logo (one time)
on:
  push:
    paths:
      - '.github/workflows/import-fmv-brand.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Import uploaded official brand artwork and create fast icons
        env:
          FMV_BRAND_SOURCE: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fa58fc6f9-b633-4792-b421-c457ed603aa6/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKBnv2_qTxH4Kl1kW1J-axPhN6Azy2iPh_OTq5ccCMf9&exp=1795293842&osig=AAAAAAAAAAAAAAAAAAAAALnGCozdsNJ_5gmHilua5iIi8lvwPmdJEcehjiaKgret&signer=media-rpc&token=AAIAAU0AJGE1OGZjNmY5LWI2MzMtNDc5Mi1iNDIxLWM0NTdlZDYwM2FhNgAAAAABof_aClBzipxErZ_N_MRxEAVQxfFhByiS_8MgJpR1-zSPxDVvWw&x-canva-quality=thumbnail"
        run: python .github/scripts/import-fmv-brand.py
      - name: Commit local brand assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand
          if [ -d website/assets/brand ]; then git add website/assets/brand; fi
          git diff --cached --quiet || git commit -m "Add official FMV logo, favicon and social assets"
          git push
