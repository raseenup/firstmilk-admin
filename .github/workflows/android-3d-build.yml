name: Build FMV admin 360-degree Android debug APK
on:
  pull_request:
    paths:
      - 'immersive-3d.js'
      - 'immersive-3d.css'
      - 'index.html'
      - 'android-app/**'
      - '.github/workflows/android-3d-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    name: Compile and verify Android debug package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Validate 3D script
        run: node --check immersive-3d.js
      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm install --no-audit --no-fund
      - name: Stage original portal and generate Android project
        working-directory: android-app
        run: npm run android:prepare
      - name: Build Android debug APK
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Require APK to stay under 200 MB
        run: |
          FILE=android-app/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$FILE"
          SIZE=$(stat -c '%s' "$FILE")
          echo "Debug APK size: $SIZE bytes"
          test "$SIZE" -le 200000000
      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fmv-admin-360-3d-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
