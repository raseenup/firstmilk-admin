name: First Milk portal JavaScript syntax
on:
  pull_request:
    paths:
      - '**/*.js'
      - 'android-app/scripts/stage.mjs'
      - 'tests/**/*.cjs'
      - 'assets/brand/**'
      - 'brand.css'
      - 'manifest.webmanifest'
      - 'index.html'
      - '.github/workflows/portal-features-ci.yml'
  workflow_dispatch:
jobs:
  javascript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original and additive JavaScript
        run: |
          node --check 'admin.js'
          node --check 'experience.js'
          node --check 'studio.js'
          node --check 'return-collections.js'
          node --check 'yard-quality.js'
          node --check 'media-uploader.js'

      - name: Install browser-test dependencies
        run: npm install --no-save jsdom@27.2.0
      - name: Run shared portal browser tests
        run: node --test tests/android-stage.test.cjs tests/official-brand.test.cjs tests/media-upload.test.cjs tests/return-quality-ui.test.cjs tests/return-collection-ui.test.cjs tests/portal-core.test.cjs
